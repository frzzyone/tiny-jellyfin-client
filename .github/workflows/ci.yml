name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (JellyfinKit + PlayerCore core)
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev ffmpeg python3 pkg-config
      - name: JellyfinKit tests
        run: swift test --package-path Packages/JellyfinKit
      - name: Generate fixtures
        run: scripts/make-fixtures.sh
      - name: PlayerCore tests
        run: swift test --package-path Packages/PlayerCore

  macos:
    name: macOS (packages + app)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Restore FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: Vendor/FFmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        run: scripts/build-ffmpeg.sh
      - name: Save FFmpeg build
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Vendor/FFmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Install tools
        run: brew install xcodegen ffmpeg
      - name: Generate fixtures
        run: scripts/make-fixtures.sh
      - name: JellyfinKit tests
        run: swift test --package-path Packages/JellyfinKit
      - name: PlayerCore tests
        run: swift test --package-path Packages/PlayerCore
      - name: Package tests on an iPhone simulator
        run: scripts/test-ios.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: App build and tests
        run: |
          set -o pipefail
          xcodebuild test -project TinyJellyfin.xcodeproj -scheme TinyJellyfin -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" > xcodebuild-test.log 2>&1 || status=$?
          grep -E "error:|Test Case .* failed|Executed [0-9]+ tests|\*\* TEST" xcodebuild-test.log | tail -100
          exit ${status:-0}
      - name: iPhone and Apple TV builds
        # The FFmpeg simulator slices are arm64 only.
        run: |
          set -o pipefail
          for scheme in TinyJellyfinPhone:iOS TinyJellyfinTV:tvOS; do
            xcodebuild -project TinyJellyfin.xcodeproj -scheme "${scheme%%:*}" -configuration Debug \
              -destination "generic/platform=${scheme##*:} Simulator" ARCHS=arm64 build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -5
          done
      - name: Release build
        run: |
          set -o pipefail
          xcodebuild -project TinyJellyfin.xcodeproj -scheme TinyJellyfin -configuration Release build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" | tail -20
