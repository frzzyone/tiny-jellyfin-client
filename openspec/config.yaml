schema: spec-driven

context: |
  Native macOS, iPhone and Apple TV apps (not web, Electron or Catalyst). Target macOS 14 Sonoma, iOS 17 and tvOS 17 and later.
  Swift + SwiftUI for UI. Playback uses our own engine: FFmpeg for demuxing (and software audio decoding only),
  Apple's AVSampleBuffer* renderers + VideoToolbox for video, audio, sync, HDR, Dolby Vision, Atmos and PiP.
  FFmpeg is the one approved third-party dependency: an LGPL-only build, dynamically linked, pinned version.
  Avoid any other third-party dependency unless a design justifies it.
  Talks to a self-hosted Jellyfin server (10.9+) over its REST API; never assume a cloud backend.
  Credentials and access tokens live in the Keychain, never in UserDefaults or plain files.
  Keep the app "tiny": favor a small, readable codebase over feature breadth.

