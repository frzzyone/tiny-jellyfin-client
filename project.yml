name: TinyJellyfin
options:
  bundleIdPrefix: app.tinyjellyfin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # One version for every target; bump CURRENT_PROJECT_VERSION for each upload.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    # PlayerCore's CFFmpeg module needs the FFmpeg headers wherever PlayerCore is imported.
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/FFmpeg/include"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -I$(SRCROOT)/Vendor/FFmpeg/include"
    # BrowserStyle.accent, so system-tinted controls (Retry, Sign In, sliders) are amber too.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  JellyfinKit:
    path: Packages/JellyfinKit
  PlayerCore:
    path: Packages/PlayerCore
targets:
  TinyJellyfin:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # FFmpeg's licence and build record, shown under Acknowledgements (written by build-ffmpeg.sh).
      - path: Vendor/FFmpeg/COPYING.LGPLv2.1
        buildPhase: resources
      - path: Vendor/FFmpeg/BUILD-INFO
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
      - package: PlayerCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tinyfin
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "FFmpeg is used under the LGPL v2.1 — see Tinyfin › Acknowledgements."
        NSLocalNetworkUsageDescription: "Tinyfin connects to your Jellyfin server on this network."
        # Self-hosted Jellyfin servers are commonly plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tinyjellyfin.TinyJellyfin
        # The Mac app's file is Tinyfin.app; the module keeps its old name for the tests.
        PRODUCT_NAME: Tinyfin
        PRODUCT_MODULE_NAME: TinyJellyfin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      # Release is what gets archived and handed out: signed by your team with the hardened
      # runtime, so Organizer's Direct Distribution can re-sign it with Developer ID and notarise.
      # Debug stays ad hoc so it builds without a team.
      configs:
        Release:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          ENABLE_HARDENED_RUNTIME: YES
    configFiles:
      Release: App/Signing.xcconfig
    scheme:
      testTargets:
        - TinyJellyfinTests
  TinyJellyfinPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Shared
      - path: App/iOS
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      # FFmpeg's licence and build record, shown under Acknowledgements (written by build-ffmpeg.sh).
      - path: Vendor/FFmpeg/COPYING.LGPLv2.1
        buildPhase: resources
      - path: Vendor/FFmpeg/BUILD-INFO
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
      - package: PlayerCore
    info:
      path: App/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Tinyfin
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        # Self-hosted Jellyfin servers are commonly plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Tinyfin connects to your Jellyfin server on this network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tinyjellyfin.Tinyfin
        # The app's file is Tinyfin.app; the module keeps its old name, as on the Mac.
        PRODUCT_NAME: Tinyfin
        PRODUCT_MODULE_NAME: TinyJellyfin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    # The team comes from App/Signing.local.xcconfig (git-ignored); see App/Signing.xcconfig.
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
  TinyJellyfinTV:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Shared
        excludes: [Views/SignInViews.swift]  # the TV has its own, with Quick Connect
      - path: App/tvOS
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/TV.xcassets
      - path: App/Resources/tvOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Vendor/FFmpeg/COPYING.LGPLv2.1
        buildPhase: resources
      - path: Vendor/FFmpeg/BUILD-INFO
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
      - package: PlayerCore
      - target: TinyJellyfinTopShelf
    # Shared with the Top Shelf: preferences in the App Group, the token in the first (so default)
    # Keychain group.
    entitlements:
      path: App/Resources/TinyJellyfinTV.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tinyjellyfin.Tinyfin]
        keychain-access-groups: ["$(AppIdentifierPrefix)app.tinyjellyfin.Tinyfin"]
    info:
      path: App/Resources/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Tinyfin
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Top Shelf links: tinyjellyfin://item/<id>, tinyjellyfin://play/<id>.
        CFBundleURLTypes:
          - CFBundleURLName: app.tinyjellyfin.Tinyfin
            CFBundleURLSchemes: [tinyjellyfin]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Tinyfin connects to your Jellyfin server on this network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tinyjellyfin.Tinyfin
        # The app's file is Tinyfin.app; the module keeps its old name, as on the Mac.
        PRODUCT_NAME: Tinyfin
        PRODUCT_MODULE_NAME: TinyJellyfin
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
  TinyJellyfinTopShelf:
    type: app-extension
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: App/TopShelf
      - path: App/tvOS/TVShared.swift
      - path: App/Shared/KeychainTokenStore.swift
      - path: App/Shared/TopShelfLink.swift
      - path: App/Resources/tvOS/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
      - sdk: TVServices.framework
    entitlements:
      path: App/Resources/TinyJellyfinTopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.app.tinyjellyfin.Tinyfin]
        keychain-access-groups: ["$(AppIdentifierPrefix)app.tinyjellyfin.Tinyfin"]
    info:
      path: App/Resources/Info-TopShelf.plist
      properties:
        CFBundleDisplayName: Tinyfin Top Shelf
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Tinyfin connects to your Jellyfin server on this network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tinyjellyfin.Tinyfin.topshelf
        PRODUCT_NAME: TinyfinTopShelf
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
  TinyJellyfinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: TinyJellyfin
      - package: JellyfinKit
      - package: PlayerCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tinyfin.app/Contents/MacOS/Tinyfin"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
