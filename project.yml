name: TinyJellyfin
options:
  bundleIdPrefix: app.tinyjellyfin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    # PlayerCore's CFFmpeg module needs the FFmpeg headers wherever PlayerCore is imported.
    HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Vendor/FFmpeg/include"
    OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -I$(SRCROOT)/Vendor/FFmpeg/include"
packages:
  JellyfinKit:
    path: Packages/JellyfinKit
  PlayerCore:
    path: Packages/PlayerCore
targets:
  TinyJellyfin:
    type: application
    platform: macOS
    sources:
      - path: App/Shared
      - path: App/macOS
      - path: App/Resources/Assets.xcassets
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
      - package: PlayerCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tiny Jellyfin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "FFmpeg is used under the LGPL v2.1 — see Acknowledgements."
        # Self-hosted Jellyfin servers are commonly plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tinyjellyfin.TinyJellyfin
        PRODUCT_NAME: TinyJellyfin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets:
        - TinyJellyfinTests
  TinyJellyfinPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Shared
      - path: App/iOS
      - path: App/Resources/Assets.xcassets
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: JellyfinKit
      - package: PlayerCore
    info:
      path: App/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Tiny Jellyfin
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        # Self-hosted Jellyfin servers are commonly plain HTTP on the LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "Tiny Jellyfin connects to your Jellyfin server on this network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tinyjellyfin.TinyJellyfin.phone
        PRODUCT_NAME: TinyJellyfin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    # The team comes from App/Signing.local.xcconfig (git-ignored); see App/Signing.xcconfig.
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
  TinyJellyfinTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: TinyJellyfin
      - package: JellyfinKit
      - package: PlayerCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TinyJellyfin.app/Contents/MacOS/TinyJellyfin"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
